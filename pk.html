<!DOCTYPE html>
<html lang="id" data-page="artefak">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artefak Pembelajaran | Portofolio</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <div id="navbar-placeholder"></div>

    <main class="container fade-in-section page-padding">
        <h2 class="page-title">Artefak Projek Kepemimpinan</h2>

        <div class="accordion-container">

            <!-- TOPIK 1 -->
            <div class="accordion-item card glass">

                <button class="accordion-header">
                    <span>Bab 1: Visi Guru profesional</span>
                    <span class="accordion-icon">&#9662;</span>
                </button>

                <div class="accordion-content">
                    <div class="lk-inner">

                        <!-- Tombol LK -->
                        <div class="pdf-buttons">

                            <button onclick="openPDF('https://drive.google.com/file/d/1n5VYFaYWXYZJpx2a-GCtov7k4ubi0bf-/preview')">
                                LK 2.1 
                            </button>

                        </div>

                    </div>
                </div>
            </div>

            <!-- TOPIK 2 -->
            <div class="accordion-item card glass">
                <button class="accordion-header">
                    <span>Bab 2: Perencanaan Projek Kepemimpinan</span>
                    <span class="accordion-icon">&#9662;</span>
                </button>

                <div class="accordion-content">
                    <div class="lk-inner">

                        <div class="pdf-buttons">
                            <button onclick="openPDF('https://drive.google.com/file/d/1lUs-HNCJKsAjStDwNk8IVZXAIxYd1tgs/preview')">
                                LK 4.1
                            </button>

                            <button onclick="openPDF('https://drive.google.com/file/d/1xrZ5sU3VnPqOCjJGxu9E8xmtip30-7jA/preview')">
                                LK 5.1
                            </button>

                            <button onclick="openPDF('https://drive.google.com/file/d/1ZB00hncsKVS_gYS4QfreEGpCOlqHYiEA/preview')">
                                LK 6.1
                            </button>
                        </div>

                    </div>
                </div>
            </div>


            <!-- TOPIK 3 -->
            <div class="accordion-item card glass">
                <button class="accordion-header">
                    <span>Bab 3: Implementasi dan Manajemen Projek</span>
                    <span class="accordion-icon">&#9662;</span>
                </button>

            </div> 


            <!-- TOPIK 4 -->
            <div class="accordion-item card glass">
                <button class="accordion-header">
                    <span>Bab 4: Projek Monitoring, Evaluasi, Laporan Akhir, Refleksi</span>
                    <span class="accordion-icon">&#9662;</span>
                </button>

                <div class="accordion-content">
                    <div class="lk-inner">

                        <!-- Group Badge 2 PDF per Siklus (Opsi 2) -->
                        <div class="pdf-buttons" style="display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px;">
                            
                            <button onclick="openPDF('https://drive.google.com/file/d/1xcBlIoVZX_fmUQ2OC3JmOUR63UM2B0-9/preview')">
                                LK 8.1
                            </button>

                            <button onclick="openPDF('https://drive.google.com/file/d/1L8SfIPHH860XQGvDKMtcPQBANuKdR4ek/preview')">
                                LK 9.1
                            </button>

                            <button onclick="openPDF('https://drive.google.com/file/d/1U7Eg9VpfWO1mps606y4Ph-ndkAcgIw8U/preview')">
                                LK 10.1
                            </button>

                        </div>

                    </div>
                </div>
            </div>

        </div>
    </main>


    <!-- Modal PDF -->
    <div id="pdfModal" class="pdf-modal">
        <div class="pdf-container">

            <button class="close-btn" onclick="closePDF()">
                ✖ Close
            </button>

            <iframe
                id="pdfFrame"
                frameborder="0">
            </iframe>

        </div>
    </div>


    <div id="footer-placeholder"></div>

    <button id="back-to-top">
        &#8593;
    </button>

    <script src="script.js"></script>

</body>
</html>
